name: memento
description: MEMENTO - private memory preservation, temporal & geospatial rediscovery.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  equatable: ^2.0.5
  flutter_bloc: ^8.1.6

  get_it: ^7.7.0

  sqflite: ^2.3.3
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2

  cryptography: ^2.7.0
  crypto: ^3.0.3

  geolocator: ^13.0.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.10.9
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
